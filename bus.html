<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bus Ride Tracker</title>
<style>
  :root{
    --ink:#1a1a1a;
    --paper:#f7f5ef;
    --line:#1a1a1a;
    --yellow:#ffc63d;
    --route:#2e6f5e;
    --muted:#6b675c;
    --card:#ffffff;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family: 'Courier New', ui-monospace, monospace;
    background:var(--paper);
    color:var(--ink);
    min-height:100vh;
    padding:24px 16px 60px;
  }
  .wrap{max-width:640px;margin:0 auto;}

  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:3px solid var(--line);
    padding-bottom:14px;
    margin-bottom:22px;
  }
  header h1{
    font-size:1.5rem;
    margin:0;
    letter-spacing:-0.02em;
  }
  header h1 span{
    background:var(--yellow);
    padding:2px 8px;
    border:2px solid var(--line);
    display:inline-block;
    transform:rotate(-1deg);
  }
  .route-badge{
    font-size:.75rem;
    color:var(--muted);
  }

  form{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:24px;
    background:var(--card);
    border:2px solid var(--line);
    padding:16px;
    box-shadow:4px 4px 0 var(--line);
  }
  form .full{grid-column:1/-1;}
  label{
    font-size:.7rem;
    text-transform:uppercase;
    letter-spacing:.08em;
    color:var(--muted);
    display:block;
    margin-bottom:4px;
  }
  input{
    width:100%;
    padding:8px 10px;
    border:2px solid var(--line);
    background:var(--paper);
    font-family:inherit;
    font-size:.9rem;
  }
  input:focus{outline:2px solid var(--route);outline-offset:1px;}
  button{
    grid-column:1/-1;
    padding:10px;
    background:var(--route);
    color:var(--paper);
    border:2px solid var(--line);
    font-family:inherit;
    font-weight:bold;
    letter-spacing:.05em;
    text-transform:uppercase;
    font-size:.85rem;
    cursor:pointer;
  }
  button:hover{background:#245c4d;}
  button:focus-visible{outline:3px solid var(--yellow);outline-offset:2px;}

  .stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-bottom:24px;
  }
  .stat{
    border:2px solid var(--line);
    background:var(--card);
    padding:10px;
    text-align:center;
  }
  .stat .num{font-size:1.4rem;font-weight:bold;}
  .stat .lbl{font-size:.65rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;}

  ul{list-style:none;margin:0;padding:0;}
  li{
    border:2px solid var(--line);
    background:var(--card);
    padding:12px 14px;
    margin-bottom:10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
  }
  .ride-info{display:flex;flex-direction:column;gap:2px;}
  .ride-route{font-weight:bold;}
  .ride-meta{font-size:.75rem;color:var(--muted);}
  .ride-fare{font-weight:bold;color:var(--route);white-space:nowrap;}
  .del{
    background:none;
    border:none;
    color:var(--ink);
    cursor:pointer;
    font-size:1rem;
    padding:0 4px;
  }
  .del:hover{color:#b3261e;}

  .empty{
    text-align:center;
    color:var(--muted);
    border:2px dashed var(--line);
    padding:30px 10px;
    font-size:.85rem;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span>🚌 Bus Ride Tracker</span></h1>
    <div class="route-badge" id="rideCount">0 rides logged</div>
  </header>

  <form id="rideForm">
    <div class="full">
      <label for="route">Route / Bus No.</label>
      <input type="text" id="route" placeholder="e.g. 12A Sundhara" required>
    </div>
    <div>
      <label for="from">From</label>
      <input type="text" id="from" placeholder="Boarding stop" required>
    </div>
    <div>
      <label for="to">To</label>
      <input type="text" id="to" placeholder="Drop-off stop" required>
    </div>
    <div>
      <label for="fare">Fare</label>
      <input type="number" id="fare" placeholder="0" min="0" step="0.5" required>
    </div>
    <div>
      <label for="date">Date</label>
      <input type="date" id="date" required>
    </div>
    <button type="submit">+ Log Ride</button>
  </form>

  <div class="stats">
    <div class="stat"><div class="num" id="totalRides">0</div><div class="lbl">Rides</div></div>
    <div class="stat"><div class="num" id="totalFare">0</div><div class="lbl">Total Fare</div></div>
    <div class="stat"><div class="num" id="avgFare">0</div><div class="lbl">Avg / Ride</div></div>
  </div>

  <ul id="rideList"></ul>
  <div class="empty" id="emptyState">No rides yet — log your first one above.</div>
</div>

<script>
  let rides = [];

  const form = document.getElementById('rideForm');
  const list = document.getElementById('rideList');
  const emptyState = document.getElementById('emptyState');
  const dateInput = document.getElementById('date');
  dateInput.valueAsDate = new Date();

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const ride = {
      id: Date.now(),
      route: document.getElementById('route').value.trim(),
      from: document.getElementById('from').value.trim(),
      to: document.getElementById('to').value.trim(),
      fare: parseFloat(document.getElementById('fare').value) || 0,
      date: document.getElementById('date').value
    };
    rides.unshift(ride);
    form.reset();
    dateInput.valueAsDate = new Date();
    render();
  });

  function deleteRide(id){
    rides = rides.filter(r => r.id !== id);
    render();
  }

  function render(){
    list.innerHTML = '';
    emptyState.style.display = rides.length ? 'none' : 'block';

    rides.forEach(r => {
      const li = document.createElement('li');
      li.innerHTML = `
        <div class="ride-info">
          <div class="ride-route">${escapeHtml(r.route)}</div>
          <div class="ride-meta">${escapeHtml(r.from)} → ${escapeHtml(r.to)} · ${r.date}</div>
        </div>
        <div class="ride-fare">${r.fare.toFixed(2)}</div>
        <button class="del" title="Delete" data-id="${r.id}">✕</button>
      `;
      li.querySelector('.del').addEventListener('click', () => deleteRide(r.id));
      list.appendChild(li);
    });

    const total = rides.length;
    const totalFare = rides.reduce((s, r) => s + r.fare, 0);
    const avg = total ? totalFare / total : 0;

    document.getElementById('rideCount').textContent = `${total} ride${total !== 1 ? 's' : ''} logged`;
    document.getElementById('totalRides').textContent = total;
    document.getElementById('totalFare').textContent = totalFare.toFixed(2);
    document.getElementById('avgFare').textContent = avg.toFixed(2);
  }

  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  render();
</script>
</body>
</html>
